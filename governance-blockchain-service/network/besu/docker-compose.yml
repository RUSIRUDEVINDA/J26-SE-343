services:
  validator1:
    image: hyperledger/besu:26.9.0
    container_name: besu-validator1
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - .:/opt/besu/work:rw
      - validator1-data:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/work/genesis.json
      - --node-private-key-file=/opt/besu/work/nodes/validator1/key
      - --p2p-port=30303
      - --p2p-host=172.29.0.2
      - --rpc-http-enabled=false
      - --min-gas-price=0
      - --permissions-nodes-config-file-enabled=true
      - --permissions-nodes-config-file=/opt/besu/work/permissions_config.toml
      - --permissions-accounts-config-file-enabled=true
      - --permissions-accounts-config-file=/opt/besu/work/permissions_config.toml
    networks:
      besu-network:
        ipv4_address: 172.29.0.2

  validator2:
    image: hyperledger/besu:26.9.0
    container_name: besu-validator2
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - .:/opt/besu/work:rw
      - validator2-data:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/work/genesis.json
      - --node-private-key-file=/opt/besu/work/nodes/validator2/key
      - --p2p-port=30303
      - --p2p-host=172.29.0.3
      - --bootnodes=enode://03c0be1e0a232119cb61644d69507fe68961d4b1264567ef86ace9872bca762c402544febeec2b4c570b438723ccf7c442f5f8e072c5fe805569c1ef57aab3e2@172.29.0.2:30303
      - --rpc-http-enabled=false
      - --min-gas-price=0
      - --permissions-nodes-config-file-enabled=true
      - --permissions-nodes-config-file=/opt/besu/work/permissions_config.toml
      - --permissions-accounts-config-file-enabled=true
      - --permissions-accounts-config-file=/opt/besu/work/permissions_config.toml
    networks:
      besu-network:
        ipv4_address: 172.29.0.3
    depends_on:
      - validator1

  validator3:
    image: hyperledger/besu:26.9.0
    container_name: besu-validator3
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - .:/opt/besu/work:rw
      - validator3-data:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/work/genesis.json
      - --node-private-key-file=/opt/besu/work/nodes/validator3/key
      - --p2p-port=30303
      - --p2p-host=172.29.0.4
      - --bootnodes=enode://03c0be1e0a232119cb61644d69507fe68961d4b1264567ef86ace9872bca762c402544febeec2b4c570b438723ccf7c442f5f8e072c5fe805569c1ef57aab3e2@172.29.0.2:30303
      - --rpc-http-enabled=false
      - --min-gas-price=0
      - --permissions-nodes-config-file-enabled=true
      - --permissions-nodes-config-file=/opt/besu/work/permissions_config.toml
      - --permissions-accounts-config-file-enabled=true
      - --permissions-accounts-config-file=/opt/besu/work/permissions_config.toml
    networks:
      besu-network:
        ipv4_address: 172.29.0.4
    depends_on:
      - validator1

  validator4:
    image: hyperledger/besu:26.9.0
    container_name: besu-validator4
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - .:/opt/besu/work:rw
      - validator4-data:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/work/genesis.json
      - --node-private-key-file=/opt/besu/work/nodes/validator4/key
      - --p2p-port=30303
      - --p2p-host=172.29.0.5
      - --bootnodes=enode://03c0be1e0a232119cb61644d69507fe68961d4b1264567ef86ace9872bca762c402544febeec2b4c570b438723ccf7c442f5f8e072c5fe805569c1ef57aab3e2@172.29.0.2:30303
      - --rpc-http-enabled=false
      - --min-gas-price=0
      - --permissions-nodes-config-file-enabled=true
      - --permissions-nodes-config-file=/opt/besu/work/permissions_config.toml
      - --permissions-accounts-config-file-enabled=true
      - --permissions-accounts-config-file=/opt/besu/work/permissions_config.toml
    networks:
      besu-network:
        ipv4_address: 172.29.0.5
    depends_on:
      - validator1

  rpc-node:
    image: hyperledger/besu:26.9.0
    container_name: besu-rpc-node
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - .:/opt/besu/work:rw
      - rpc-data:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/work/genesis.json
      - --node-private-key-file=/opt/besu/work/nodes/rpc-node/key
      - --p2p-port=30303
      - --p2p-host=172.29.0.6
      - --bootnodes=enode://03c0be1e0a232119cb61644d69507fe68961d4b1264567ef86ace9872bca762c402544febeec2b4c570b438723ccf7c442f5f8e072c5fe805569c1ef57aab3e2@172.29.0.2:30303
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --min-gas-price=0
      - --permissions-nodes-config-file-enabled=true
      - --permissions-nodes-config-file=/opt/besu/work/permissions_config.toml
      - --permissions-accounts-config-file-enabled=true
      - --permissions-accounts-config-file=/opt/besu/work/permissions_config.toml
    ports:
      - "8545:8545"
    networks:
      besu-network:
        ipv4_address: 172.29.0.6
    depends_on:
      - validator1
      - validator2
      - validator3
      - validator4

networks:
  besu-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  validator1-data:
  validator2-data:
  validator3-data:
  validator4-data:
  rpc-data:
