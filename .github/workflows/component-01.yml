name: Component 01

on:
  push:
    paths:
      - "StateLandGovernance/**"
      - "StateLandGovernance.Web/**"
      - ".github/workflows/component-01.yml"
  pull_request:
    paths:
      - "StateLandGovernance/**"
      - "StateLandGovernance.Web/**"
      - ".github/workflows/component-01.yml"

jobs:
  land-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Land Intelligence unit tests
        working-directory: StateLandGovernance
        run: dotnet test tests/UnitTests/LandIntelligence/StateLandGovernance.UnitTests.LandIntelligence.csproj --filter "Category!=Integration"
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: StateLandGovernance.Web/package-lock.json

      - name: Install web dependencies
        working-directory: StateLandGovernance.Web
        run: npm ci

      - name: Component 01 frontend tests
        working-directory: StateLandGovernance.Web
        run: npm run test:component-01

      - name: Next.js production build
        working-directory: StateLandGovernance.Web
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5264
